<meta name="theme-color" content="#6A3FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#E8EDEF; --surface:#F7F9FA; --ink:#13232B; --muted:#586A72; --line:#CBD5DA;
  --accent:#6A3FA0; --accent-ink:#FFFFFF; --custom:#A85A05; --custom-bg:#F8E9D3;
  --sub:#1F5F82; --sub-bg:#DCEBF3; --lens:#1D2B32; --field:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F181D; --surface:#17232A; --ink:#E6EEF1; --muted:#93A5AE; --line:#2B3A42;
    --accent:#B593E6; --accent-ink:#1A0F2B; --custom:#F0B36A; --custom-bg:#3A2A14;
    --sub:#8CC5E3; --sub-bg:#173141; --lens:#05090B; --field:#101B21;
  }
}
:root[data-theme="dark"]{
  --bg:#0F181D; --surface:#17232A; --ink:#E6EEF1; --muted:#93A5AE; --line:#2B3A42;
  --accent:#B593E6; --accent-ink:#1A0F2B; --custom:#F0B36A; --custom-bg:#3A2A14;
  --sub:#8CC5E3; --sub-bg:#173141; --lens:#05090B; --field:#101B21;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
#app{max-width:560px;margin:0 auto}
h1{font-size:22px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 16px 10px;
}
.dev select{
  max-width:170px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--field);font-size:14px;
}
main{padding:4px 16px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
.card.flush > h2{padding:14px 14px 0}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.chip{
  min-height:46px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  font-size:14px;font-weight:500;line-height:1.2;text-align:center;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.view{min-width:0}
.view h3{font-size:13px;font-weight:700;margin:0 0 6px}
.view svg{display:block;width:100%;max-width:170px;height:auto;margin:0 auto 10px}
.views .legend{gap:8px}
.views .legend .v{font-size:13.5px}
.views .legend .it{align-items:flex-start}
.views .legend .sw{margin-top:2px}
.preview{display:flex;gap:14px;align-items:center}
.preview svg{width:148px;height:148px;flex:none}
.legend{flex:1;min-width:0;display:grid;gap:10px}
.legend .it{display:flex;gap:10px;align-items:center;min-width:0}
.legend .sw{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.legend .sw.ring{background:transparent!important;border-width:4px;border-style:solid;width:18px;height:18px}
.legend .t{font-size:12.5px;color:var(--muted);line-height:1.2}
.legend .v{font-size:15px;font-weight:600;line-height:1.25}
.pol{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.pol.amber{background:var(--custom);border-color:var(--custom);color:var(--surface)}
.pol.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scn-title{font-size:13.5px;color:var(--muted);margin:0 0 10px}

.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row .name{font-weight:600;font-size:15px}
.row .hint{grid-column:1 / -1;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:-2px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.custom{background:var(--custom-bg);color:var(--custom)}
.pill.sub{background:var(--sub-bg);color:var(--sub)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:12.5px;text-align:left}
.num{display:flex;align-items:center;gap:6px}
.num button{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:20px;line-height:1;padding:0}
.num input{width:66px;height:36px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--field);font-variant-numeric:tabular-nums;font-weight:600;padding:0 4px;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .u{font-size:13px;color:var(--muted);width:22px}
select.f{height:38px;max-width:160px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.switch{min-width:68px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:14px;padding:0 14px}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch:disabled{opacity:.45;cursor:not-allowed}

textarea{width:100%;min-height:76px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--field);resize:vertical}
input.txt{width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.btn{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#B3261E;border-color:#B3261E}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg{font-size:14px;margin-top:10px;color:var(--ink)}
.small{font-size:13px;color:var(--muted)}

details.sw2{border-top:1px solid var(--line)}
details.sw2:first-of-type{border-top:0}
details.sw2 summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.sw2 summary::-webkit-details-marker{display:none}
details.sw2 summary::after{content:"+";color:var(--muted);font-weight:500}
details.sw2[open] summary::after{content:"–"}
details.sw2 .body{padding:0 14px 14px}
details.sw2 ol{margin:8px 0 0;padding-left:22px}
details.sw2 li{margin:4px 0}

.rng{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:10px}
.rng .num input{width:70px}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:600;font-size:14px;padding:0;margin-bottom:6px}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.chk .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}

.chk .nm{line-height:1.2}
.chk .x{margin-left:auto;width:32px;height:32px;border:0;background:none;font-size:22px;color:var(--muted);padding:0}
.addf{margin-top:10px}
.addr{display:flex;gap:8px;margin-top:8px;align-items:center}
.addr input[type=color]{width:44px;height:42px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);flex:none}
.addr select.f{flex:1;min-width:0;max-width:none;height:42px}
.hotwrap svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.hot{cursor:pointer}
.view.hot{border-radius:10px;transition:background .15s}
.view.hot:hover{background:rgba(127,127,127,.08)}
.flash{animation:flashKey 1.2s ease}
@keyframes flashKey{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:0 12px;height:38px;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{display:block;margin-bottom:4px}
.cat{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat .cbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.btn.sm{min-height:36px;font-size:13px;padding:0 10px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sub-bg);color:var(--sub);margin-left:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted)}
ul.rules{margin:0;padding-left:20px}
ul.rules li{margin:6px 0}

.authwrap{min-height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.authcard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
.authcard h1{font-size:20px}
.authcard .btns{display:flex}
.authcard .btn{flex:1}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 2px}
.homecard{min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16px;font-weight:700;color:var(--ink)}
.homecard:active{background:rgba(127,127,127,.12)}
.hic{font-size:38px;line-height:1}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;padding:12px 4px 12px;font-size:14px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{border-top-color:var(--accent);color:var(--ink);font-weight:700}
@media (max-width:360px){.preview{flex-direction:column;align-items:flex-start}}

var ACC_KEY='visier-konto-v1', SESSION_KEY='visier-entsperrt';
function loadAccount(){ try{ var r=localStorage.getItem(ACC_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveAccount(a){ try{ localStorage.setItem(ACC_KEY,JSON.stringify(a)); }catch(e){} }
function isUnlocked(){ try{ return sessionStorage.getItem(SESSION_KEY)==='1'; }catch(e){ return false; } }

function randHex(n){
  var a=new Uint8Array(n);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(var i=0;i<n;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function hashPass(pw,salt){
  var msg=salt+':'+pw;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }
  var h=2166136261;
  for(var i=0;i<msg.length;i++){ h^=msg.charCodeAt(i); h=(h*16777619)>>>0; }
  for(var r=0;r<2000;r++){ h=((h^(r*2654435761))>>>0); h=(h*16777619)>>>0; }
  return Promise.resolve('fnv'+h.toString(16));
}

function authSubmit(){
  var a=authUi;
  a.msg='';
  var email=a.email.trim();
  if(a.mode==='register'){
    if(!email||email.indexOf('@')<1||email.indexOf('.')<0){ a.msg='Bitte eine gültige E-Mail eingeben.'; render(); return; }
    if(!a.pass||a.pass.length<4){ a.msg='Das Passwort muss mindestens 4 Zeichen haben.'; render(); return; }
    if(a.pass!==a.pass2){ a.msg='Die Passwörter stimmen nicht überein.'; render(); return; }
    if(a.busy) return;
    a.busy=true; render();
    var salt=randHex(16);
    hashPass(a.pass,salt).then(function(hash){
      account={email:email,salt:salt,hash:hash};
      saveAccount(account);
      setUnlocked(true);
      a.busy=false; a.pass=''; a.pass2=''; a.msg=''; a.mode='login';
      ui.section='home';
      render();
    }).catch(function(){ a.busy=false; a.msg='Konto konnte nicht erstellt werden.'; render(); });
  } else {
    if(!account){ a.mode='register'; render(); return; }
    if(!a.pass){ a.msg='Bitte Passwort eingeben.'; render(); return; }
    if(a.busy) return;
    a.busy=true; render();
    hashPass(a.pass,account.salt).then(function(hash){
      a.busy=false;
      if(hash===account.hash){ setUnlocked(true); a.pass=''; a.msg=''; ui.section='home'; render(); }
      else { a.msg='Passwort ist falsch.'; render(); }
    }).catch(function(){ a.busy=false; a.msg='Anmeldung ist gerade nicht möglich.'; render(); });
  }
}

var SHADE_OK=['sonne_hinten','sonne_vorne','sonne_seite','sonne_oben','misch'], SHIELD_OK=['sonne_vorne','sonne_seite'];
var IRIS_GREY=['Graustufe 1','Graustufe 2','Graustufe 3','Graustufe 4'], DUP_GREY=['Hellgrau','Grau','Dunkelgrau'];
function lightFlags(p,s){
  return {shade:!!state.cond.shade&&SHADE_OK.indexOf(s.id)>=0,
          shield:!!state.cond.shield&&SHIELD_OK.indexOf(s.id)>=0};
}
function ovKey(p,s){
  var L=lightFlags(p,s), parts=[]; if(L.shade) parts.push('schatten'); if(L.shield) parts.push('blende');
  return s.id+(parts.length?'|'+parts.join('+'):'');
}
function lighter(av,name,list,n){
  var e=av.filter(function(x){return x.name===name;})[0]; if(!e||!e.like) return null;
  var i=list.indexOf(e.like); if(i<0) return null;
  var cur=null, moved=0, nm;
  for(var j=i-1;j>=0&&moved<n;j--){ nm=alias(av,list[j]); if(nm!==null){ cur=nm; moved++; } }
  return cur;
}
function active(){
  var p=state.profiles.filter(function(x){return x.id===state.activeId;})[0];
  if(!p && state.profiles.length){
    p=state.profiles.filter(function(x){return x.active;})[0]||state.profiles[0];
    state.activeId=p.id;
  }
  return p;
}
function scn(){ return SCENARIOS.filter(function(s){return s.id===state.scenario;})[0]; }

/* ---------- Berechnung ---------- */
function resolve(p,s){
  var L=lightFlags(p,s), key=ovKey(p,s), ov=p.overrides[key]||{}, sv=p.base[key]||{};
  var base={};
  base.iris={val:mapRange(s.iris,REF.iris,p.iris,p.steps.iris),status:'ok'};
  base.dup={val:mapRange(s.dup,REF.dup,p.dup,p.steps.dup),status:'ok'};
  base.ringS={val:mapRange(s.ringS,REF.ring,p.ring,p.steps.ring),status:'ok'};
  var f1=pickFilter(avail(p,'irisFilters'),s.irisF,FB_IRIS);
  var f2=pickFilter(avail(p,'dupFilters'),s.dupF,FB_DUP);
  var f3=s.ringC===''?{val:'',status:'ok'}:pickFilter(avail(p,'ringColors'),[s.ringC],FB_RING);
  base.irisF=f1; base.dupF=f2; base.ringC=f3;
  [['irisF',f1,s.irisF],['dupF',f2,s.dupF],['ringC',f3,[s.ringC]]].forEach(function(x){
    var b=x[1], ref=x[2].join(' / ');
    if(b.status==='sub') b.hint='Grundwert: '+ref+' – im Gerät nicht vorhanden. Ersatz: '+b.val;
    if(b.status==='none') b.hint='Grundwert: '+ref+' – im Gerät ist nichts Passendes eingetragen.';
    if(b.val===null) b.val='';
  });
  base.irisF2={val:'',status:'ok'};
  if(p.irisTwo){
    var slot=f1.val!==''?casOf(p,f1.val):(DEFAULT_CAS[s.irisF[0]]||1);
    base.irisF={val:slot===1?f1.val:'',status:slot===1?f1.status:'ok',hint:slot===1?f1.hint:undefined};
    base.irisF2={val:slot===2?f1.val:'',status:slot===2?f1.status:'ok',hint:slot===2?f1.hint:undefined};
  }
  if(s.pol && !p.hasPol) base.pol={val:false,status:'sub',hint:'Grundwert: Polarisation an – am Gerät nicht vorhanden.'};
  else base.pol={val:!!s.pol,status:'ok'};
  base.ringUV={val:false,status:'ok'};
  ['irisF','irisF2','dupF','ringC'].forEach(function(k){
    var std=p.stdFilter[k]; if(!std) return;
    var row=rowByKey(k);
    if(rowOn(p,row) && rowAvail(p,row).some(function(e){return e.name===std;})) base[k]={val:std,status:'std'};
  });
  /* Zusatzregeln der App: Schatten / Sonnenblende */
  var steps=(L.shade?1:0)+(L.shield?1:0);
  if(steps){
    var why=[]; if(L.shade) why.push('Scheibe im Schatten'); if(L.shield) why.push('Sonnenblende');
    var wtxt=why.join(' + '), stxt=steps+(steps===1?' Stufe':' Stufen')+' heller';
    var lighten=function(field,prop,list){
      var b=base[field]; if(!b||!b.val) return;
      var nn=lighter(avail(p,prop),b.val,list,steps);
      if(nn){ var old=b.val; b.val=nn; b.status='adj'; b.hint='Grundwert: '+old+' · '+wtxt+': '+stxt; }
    };
    lighten('irisF','irisFilters',IRIS_GREY); lighten('irisF2','irisFilters',IRIS_GREY); lighten('dupF','dupFilters',DUP_GREY);
  }
  if(L.shade){
    if(p.hasIris){ var ni=clamp(snap(base.iris.val+0.05,p.steps.iris),p.iris[0],p.iris[1]);
      if(Math.abs(ni-base.iris.val)>1e-9){ base.iris.hint='Grundwert: '+fmt(base.iris.val)+' mm · Scheibe im Schatten: +'+fmt(ni-base.iris.val)+' mm'; base.iris.val=ni; base.iris.status='adj'; } }
    if(p.hasDuplex){ var nd=clamp(snap(base.dup.val+0.1,p.steps.dup),p.dup[0],p.dup[1]);
      if(Math.abs(nd-base.dup.val)>1e-9){ base.dup.hint='Grundwert: '+fmt(base.dup.val)+' mm · Scheibe im Schatten: +'+fmt(nd-base.dup.val)+' mm'; base.dup.val=nd; base.dup.status='adj'; } }
  }

  var out={};
  ROWS.forEach(function(row){
    var k=row.k, b=base[k];
    var effVal=b.val, effStatus=b.status, effHint=b.hint, saved=false, sb=sv[k];
    if(sb!==undefined){
      if(row.type==='num' && typeof sb==='number'){ effVal=clamp(snap(sb,p.steps[row.rk]),p[row.rk][0],p[row.rk][1]); saved=true; }
      else if(row.type==='sel' && typeof sb==='string' && (sb===''||rowAvail(p,row).some(function(e){return e.name===sb;}))){ effVal=sb; saved=true; }
      else if(row.type==='bool' && typeof sb==='boolean' && (rowOn(p,row)||sb===false)){ effVal=sb; saved=true; }
      if(saved){ effStatus='saved'; effHint=undefined; }
    }
    var val=effVal, custom=false, o=ov[k];
    if(o!==undefined){
      if(row.type==='num' && typeof o==='number'){ val=clamp(snap(o,p.steps[row.rk]),p[row.rk][0],p[row.rk][1]); custom=true; }
      else if(row.type==='sel' && typeof o==='string' && (o===''||rowAvail(p,row).some(function(e){return e.name===o;}))){ val=o; custom=true; }
      else if(row.type==='bool' && typeof o==='boolean' && (rowOn(p,row)||o===false)){ val=o; custom=true; }
    }
    if(custom && ((typeof val==='number' && Math.abs(val-effVal)<1e-9) || val===effVal)) custom=false;
    out[k]={val:val,base:effVal,status:effStatus,hint:effHint,custom:custom,saved:saved&&!custom,saved0:saved};
  });
  return out;
}
function setField(field,val){
  var p=active(), s=scn(), r=resolve(p,s), row=ROWS.filter(function(x){return x.k===field;})[0];
  if(row.type==='num') val=clamp(snap(val,p.steps[row.rk]),p[row.rk][0],p[row.rk][1]);
  var base=r[field].base;
  var same=(typeof val==='number')?Math.abs(val-base)<1e-9:val===base;
  var key=ovKey(p,s);
  p.overrides[key]=p.overrides[key]||{};
  if(same) delete p.overrides[key][field]; else p.overrides[key][field]=val;
  if(!Object.keys(p.overrides[key]).length) delete p.overrides[key];
  save(); render();
}

var BLACK='#0C1317', EDGE='rgba(255,255,255,.3)';
/* Diopter: gross die Scheibe(n) der Iris-Filter im schwarzen Kreis (bei zwei Kassetten
   vorne ein Ring, hinten die innere Scheibe), darin kleiner die Duplex-Einheit
   (schwarz, Öffnung mit Duplex-Filter), in der Mitte die Iris-Öffnung. */
function diopterSvg(r,p,L){
  L=L||{};
  var S=32, irisMm=p.hasIris?r.iris.val:(p.iris[0]+p.iris[1])/2;
  var i1=p.hasIrisFilter?r.irisF.val:'', i2=(p.hasIrisFilter&&p.irisTwo)?r.irisF2.val:'';
  var dupOn=p.hasDuplex||p.hasDuplexFilter, dupMm=p.hasDuplex?r.dup.val:(p.dup[0]+p.dup[1])/2;
  var rOpen=dupOn?Math.min(dupMm/2*S,58):0;
  var rBody=dupOn?Math.min(76,Math.max(rOpen+16,66)):0;
  var rIris=Math.min(irisMm/2*S, dupOn?Math.max(rOpen-6,6):44);
  var o='<svg viewBox="0 0 240 240" role="img" aria-label="Diopter: grosse Scheiben der Iris-Filter, darin kleiner die Duplex-Einheit mit Filter">';
  o+='<circle cx="120" cy="120" r="112" fill="'+BLACK+'" stroke="'+EDGE+'" stroke-width="1.5"/>';
  if(i1&&i2){
    o+='<circle cx="120" cy="120" r="102" fill="'+colorOf(p,'iris',i1)+'" stroke="rgba(0,0,0,.35)" stroke-width="1"/>';
    o+='<circle cx="120" cy="120" r="86" fill="'+colorOf(p,'iris',i2)+'" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/>';
  } else {
    o+='<circle cx="120" cy="120" r="102" fill="'+colorOf(p,'iris',i1||i2)+'" stroke="rgba(0,0,0,.35)" stroke-width="1"/>';
  }
  if(dupOn){
    o+='<circle cx="120" cy="120" r="'+rBody+'" fill="'+BLACK+'" stroke="'+EDGE+'" stroke-width="1.5"/>';
    o+='<circle cx="120" cy="120" r="'+rOpen+'" fill="'+colorOf(p,'dup',p.hasDuplexFilter?r.dupF.val:'')+'" stroke="'+EDGE+'" stroke-width="1.5"/>';
  }
  o+='<circle cx="120" cy="120" r="'+rIris+'" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>';
  if(L.shield) o+='<path d="M19.5 62 A116 116 0 0 1 220.5 62" fill="none" stroke="#E0A526" stroke-width="9" stroke-linecap="round"/>';
  return o+'</svg>';
}
/* Ringkorn: Farbfilter als Scheibe mit Loch, im Loch der schwarze Ring vom Korntunnel.
   Optional ein vollflächiger UV-Filter darüber. */
function ringSvg(r,p,L){
  L=L||{};
  var mm=r.ringS.val, S=Math.min(40,84/(mm/2)), rIn=mm/2*S, rOut=rIn+12, sR=Math.min(S,rIn*0.66);
  var o='<svg viewBox="0 0 240 240" role="img" aria-label="Ringkorn mit Farbfilter, Korntunnel und Zielbild">';
  o+='<defs><pattern id="uvh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#fff" stroke-opacity=".45" stroke-width="2"/></pattern></defs>';
  o+='<circle cx="120" cy="120" r="112" fill="'+(p.hasRingFilter?colorOf(p,'ring',r.ringC.val):'#FFFFFF')+'" stroke="'+EDGE+'" stroke-width="1.5"/>';
  o+='<circle cx="120" cy="120" r="'+rOut+'" fill="'+BLACK+'" stroke="'+EDGE+'" stroke-width="1.5"/>';
  o+='<circle cx="120" cy="120" r="'+rIn+'" fill="'+(L.shade?'#A9B1AD':'#F4F6F4')+'"/>';
  o+='<circle cx="120" cy="120" r="'+sR+'" fill="'+BLACK+'"/>';
  if(p.hasRingUV&&r.ringUV.val){
    o+='<circle cx="120" cy="120" r="112" fill="#9B7BEA" opacity=".34"/><circle cx="120" cy="120" r="112" fill="url(#uvh)"/>';
  }
  return o+'</svg>';
}

function missingNote(p,s,r){

function seasonForDate(d){
  var m=d.getMonth()+1;
  if(m>=3&&m<=5) return {name:'Frühling',decl:0};
  if(m>=6&&m<=8) return {name:'Sommer',decl:23.44};
  if(m>=9&&m<=11) return {name:'Herbst',decl:0};
  return {name:'Winter',decl:-23.44};
}
function computeLageSuggestion(richtung,zeitStr){
  if(!richtung) return {msg:'Bitte einen Schiessstand wählen oder die Richtung angeben, um einen Vorschlag zu erhalten.'};
  if(richtung==='Indoor') return {lageId:'indoor',msg:'Halle mit Kunstlicht – Vorschlag: Indoor (Kunstlicht).'};
  var m=(zeitStr||'').match(/^(\d{2}):(\d{2})$/);
  if(!m) return {msg:'Bitte eine Uhrzeit angeben, um einen Vorschlag zu erhalten.'};
  var hourDec=parseInt(m[1],10)+parseInt(m[2],10)/60;
  var season=seasonForDate(new Date());
  var pos=sunPos(season.decl,hourDec);
  var lb=sunLageLabel(richtung,pos.el,pos.az);
  var map={vorne:'sonne_vorne',hinten:'sonne_hinten',seitlich:'sonne_seite',oben:'sonne_oben'};
  if(lb.k==='–'||!map[lb.k]) return {msg:'Die Sonne steht um '+zeitStr+' Uhr ('+season.name+') nicht über dem Horizont. Bitte die Lichtlage manuell wählen, z. B. Dunkel, Bewölkt oder Nebel.'};
  var sObj=SCENARIOS.filter(function(x){return x.id===map[lb.k];})[0];
  return {lageId:map[lb.k],msg:'Vorschlag anhand von Sonnenstand: '+esc(sObj.full)+' ('+lb.t+', '+season.name+').'};
}

function wizardCard(p){
  var steps=wizSteps(p), w=ui.wiz;
  if(w.stepIdx==null||w.stepIdx<0) w.stepIdx=0;
  if(w.stepIdx>=steps.length) w.stepIdx=steps.length-1;
  var key=steps[w.stepIdx], body;
  if(key==='mode') body=wizMode();
  else if(key==='ref') body=wizRef(p);
  else if(key==='iris') body=wizIris(p);
  else if(key==='dupfilt') body=wizFilt(p,'dup');
  else if(key==='ringfilt') body=wizFilt(p,'ring');
  else body=wizSummary(p);
  return '<section class="card"><h2>Grundwerte-Assistent</h2>'+body+'</section>';
}
function wizFinish(){
  var p=active(), w=ui.wiz; if(!w) return;
  if(p.hasIris){
    var vi=parseFloat(w.irisVon), bi=parseFloat(w.irisBis);
    if(isFinite(vi)&&isFinite(bi)){
      var lo=Math.min(vi,bi), hi=Math.max(vi,bi);
      if(p.irisFactory){ lo=clamp(lo,p.irisFactory[0],p.irisFactory[1]); hi=clamp(hi,p.irisFactory[0],p.irisFactory[1]); if(hi<=lo) hi=lo+0.05; }
      p.iris=[lo,hi];
    }
  }
  if(p.hasDuplexFilter) p.dupFilters=DUP_FILTERS.filter(function(n){return w.dupF.indexOf(n)>=0;});
  if(p.hasRingFilter) p.ringColors=RING_COLORS.filter(function(n){return w.ringC.indexOf(n)>=0;});
  pruneStdFilters(p); syncBase(p);
  var lageId=w.lageId;
  var ringVal=parseFloat(w.ringS);
  if(isFinite(ringVal)){ p.base[lageId]=p.base[lageId]||{}; p.base[lageId].ringS=clamp(snap(ringVal,p.steps.ring),p.ring[0],p.ring[1]); }
  var dupVal=null;
  if(p.hasDuplex){ dupVal=parseFloat(w.dupS); if(isFinite(dupVal)){ p.base[lageId]=p.base[lageId]||{}; p.base[lageId].dup=clamp(snap(dupVal,p.steps.dup),p.dup[0],p.dup[1]); } }
  delete p.overrides[lageId];
  p.needsSetup=false;
  save();
  state.scenario=lageId; ui.tab='einsatz'; ui.wiz=null;
  if(SAMPLE){
    runBaseAI({lageId:lageId,ringS:isFinite(ringVal)?p.base[lageId].ringS:null,dup:(p.hasDuplex&&isFinite(dupVal))?p.base[lageId].dup:null});
  }
  window.scrollTo(0,0);
  render();
}

function slug(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
}
function cleanCustom(list){
  var out=[];
  if(Array.isArray(list)) list.forEach(function(c){
    if(c&&typeof c.name==='string'&&c.name.trim()&&/^#[0-9a-fA-F]{6}$/.test(c.color||'')){
      out.push({name:c.name.trim().slice(0,30),color:c.color,like:IRIS_FILTERS.indexOf(c.like)>=0?c.like:'',cas:c.cas===2?2:1});
    }
  });
  return out.slice(0,20);
}
function cleanEntry(id,d){
  if(!d||typeof d.brand!=='string'||typeof d.type!=='string'||!d.brand.trim()||!d.type.trim()) return null;
  return {id:id,brand:d.brand.trim().slice(0,40),type:d.type.trim().slice(0,40),by:typeof d.by==='string'?d.by:'',
    hasIris:d.hasIris!==false,hasIrisFilter:d.hasIrisFilter!==false,iris:rng(d.iris,REF.iris),
    irisFilters:Array.isArray(d.irisFilters)?d.irisFilters.filter(function(x){return IRIS_FILTERS.indexOf(x)>=0;}):[],
    irisTwo:d.irisTwo===true,hasPol:d.hasPol===true,irisCasOf:cleanCasOf(d.irisCasOf),
    custom:cleanCustom(d.custom)};
}

      var nr={id:uid(),name:w.name.slice(0,60),typ:'fest',breiteEinstellbar:(w.bVon!=null&&w.bBis!=null&&w.bVon!==w.bBis),

function saveCatalog(){
  var p=active(), brand=p.irisBrand.trim(), type=p.irisType.trim();
  if(CAT_STATE!=='ready') return;
  if(!DB){ ui.catMsg='Diese Kopie der App kann nicht in den gemeinsamen Katalog speichern. Marke und Typ bleiben aber bei dir gespeichert.'; render(); return; }
  var id=slug(brand+' '+type);
  if(!brand||!type||!id){ ui.catMsg='Trage zuerst Marke und Typ ein.'; render(); return; }
  var payload={brand:brand,type:type,by:MY_ID||'',at:Date.now(),hasIris:p.hasIris,iris:p.iris.slice(),hasIrisFilter:p.hasIrisFilter,
    irisFilters:p.irisFilters.slice(),irisTwo:p.irisTwo,hasPol:p.hasPol,irisCasOf:p.irisCasOf,custom:p.custom.irisFilters.map(function(c){return {name:c.name,color:c.color,like:c.like,cas:c.cas===2?2:1};})};
  ui.catMsg='Speichere …'; render();
  var ref=DB.doc('irisCatalog/'+id), updated=false;
  ref.get().then(function(snap){
    if(snap.exists){
      var d=snap.data()||{};
      if(!(IS_OWNER||(MY_ID&&d.by===MY_ID))) throw {code:'exists'};
      updated=true;
    }
    return ref.set(payload);
  }).then(function(){
    ui.catMsg=updated?'Eintrag aktualisiert.':'„'+brand+' '+type+'“ ist jetzt im Katalog.';
  }).catch(function(err){
    var c=err&&err.code;
    ui.catMsg=c==='exists'?'Diese Irisblende gibt es schon im Katalog. Wähle sie über „Aus Katalog wählen“ aus.'
      :c==='quota_exceeded'?'Der Katalog ist voll.'
      :'Speichern hat nicht geklappt. Versuche es später noch einmal.';
  }).then(function(){ render(); });
}
function deleteEntry(id){
  if(!DB) return;
  if(ui.catDel!==id){ ui.catDel=id; refreshCat(); return; }
  ui.catDel='';
  DB.doc('irisCatalog/'+id).delete().then(function(){ ui.catMsg='Eintrag gelöscht.'; }).catch(function(){ ui.catMsg='Löschen hat nicht geklappt.'; }).then(function(){ render(); });
}
function startCatalog(){
  try{
    DB.collection('irisCatalog').limit(500).onSnapshot(function(snap){
      CAT=snap.docs.map(function(d){return cleanEntry(d.id,d.data());}).filter(Boolean)
        .sort(function(a,b){return (a.brand+' '+a.type).localeCompare(b.brand+' '+b.type,'de');});
      CAT_STATE='ready'; refreshCat();
    },function(){ CAT_STATE='error'; refreshCat(); });
  }catch(e){ CAT_STATE='error'; refreshCat(); }
}
function loadFrozenCatalog(){
  /* Keine Verbindung zum gemeinsamen, live gepflegten Katalog (z.B. weil diese Kopie der App
     nicht als claude.ai-Artifact laeuft). Zeige stattdessen den eingefrorenen Stand an, damit
     Ringkorn/Duplex/Irisblenden-Auswahl trotzdem nutzbar ist. Neue Eintraege koennen hier nicht
     ins gemeinsame Verzeichnis gespeichert werden (DB bleibt null). */
  CAT_OFFLINE=true;
  CAT=RAW_IRIS_SEED.map(function(e){return cleanEntry(e.id,e.data);}).filter(Boolean)
    .sort(function(a,b){return (a.brand+' '+a.type).localeCompare(b.brand+' '+b.type,'de');});
  CAT_RING=RAW_RING_SEED.map(function(e){return cleanRingCatEntry(e.id,e.data);}).filter(Boolean)
    .sort(function(a,b){return (a.brand+' '+a.name+' '+a.von).localeCompare(b.brand+' '+b.name+' '+b.von,'de');});
  CAT_DUPLEX=RAW_DUPLEX_SEED.map(function(e){return cleanDuplexCatEntry(e.id,e.data);}).filter(Boolean)
    .sort(function(a,b){return (a.brand+' '+a.name+' '+a.von).localeCompare(b.brand+' '+b.name+' '+b.von,'de');});
  CAT_STATE='ready'; CAT_RING_STATE='ready'; CAT_DUPLEX_STATE='ready';
  refreshCat();
}
function initCatalog(){
  try{
    if(!(window.claude&&typeof window.claude.use==='function')){ loadFrozenCatalog(); return; }
    window.claude.use('db').then(function(db){
      if(!db){ loadFrozenCatalog(); return; }
      DB=db;
      return window.claude.use('user').then(function(u){
        if(!u) return;
        return Promise.all([u.id(),u.isOwner()]).then(function(v){ MY_ID=v[0]; IS_OWNER=!!v[1]; });
      }).catch(function(){}).then(function(){ startCatalog(); startRingCatalog(); startDuplexCatalog(); });
    }).catch(function(){ loadFrozenCatalog(); });
  }catch(e){ loadFrozenCatalog(); }
}

/* ---------- Assistent (optional, nur wenn verfügbar) ---------- */
function runAi(){
  var txt=ui.aiText.trim();
  if(!SAMPLE||ui.aiBusy||!txt) { if(!txt){ ui.aiMsg='Beschreibe zuerst kurz das Licht.'; render(); } return; }
  ui.aiBusy=true; ui.aiMsg='Einen Moment …'; render();
  var list=SCENARIOS.map(function(s){return s.id+': '+s.full+' – '+s.desc;}).join('\n');
  var prompt='Du hilfst einem Präzisionsschützen, die Lichtlage am Stand einer von '+SCENARIOS.length+' Kategorien zuzuordnen (auch Halle/Kunstlicht ist eine davon).\n'
    +'Kategorien:\n'+list+'\n\nBeschreibung des Schützen: "'+txt.replace(/"/g,"'")+'"\n\n'
    +'Wähle die am besten passende Kategorie. Zusätzlich: "schatten" ist true, wenn die Scheiben im Schatten liegen (Dach oder Bäume) und nur der Zwischenraum sonnig ist; "blende" ist true nur, wenn der Schütze ausdrücklich eine Sonnenblende an der Optik erwähnt. Antworte ausschliesslich mit JSON in dieser Form: {"lage":"<id>","schatten":false,"blende":false,"grund":"<ein kurzer Satz auf Deutsch>"}';
  SAMPLE.json(prompt,{modelTier:'quick'}).then(function(res){
    var s=SCENARIOS.filter(function(x){return res&&x.id===res.lage;})[0];
    if(s){ state.scenario=s.id; state.cond.shade=res.schatten===true; state.cond.shield=res.blende===true; save(); ui.aiMsg='Vorschlag: '+s.full+((state.cond.shade&&SHADE_OK.indexOf(s.id)>=0)?', Scheiben im Schatten':'')+'. '+(res.grund||''); }
    else ui.aiMsg='Keine passende Lage erkannt. Beschreibe die Bedingungen genauer.';
  }).catch(function(err){
    var c=err&&err.code;
    ui.aiMsg = c==='not_granted' ? 'Ohne deine Freigabe kann der Assistent nicht antworten.'
      : c==='rate_limited' ? 'Zu viele Anfragen. Versuche es gleich noch einmal.'
      : 'Der Assistent ist gerade nicht erreichbar.';
  }).then(function(){ ui.aiBusy=false; render(); });
}
/* ---------- KI-Grundregeln je Sportgewehr ---------- */
function filterList(p,rowKey){
  return rowAvail(p,rowByKey(rowKey)).map(function(e){ return e.name+(e.like&&e.like!==e.name?' (wirkt wie '+e.like+')':''); });
}
function capabilityText(p){
  var lines=[];
  lines.push('Iris-Blende verstellbar: '+(p.hasIris?('ja, '+fmt(p.iris[0])+'–'+fmt(p.iris[1])+' mm, Schritt '+fmt(p.steps.iris)+' mm'):'nein'));
  lines.push('Iris-Farbfilter: '+(p.hasIrisFilter?'ja':'nein'));
  if(p.hasIrisFilter){
    if(p.irisTwo){ lines.push('  Kassette vorne: '+(filterList(p,'irisF').join(', ')||'keine Filter eingetragen')); lines.push('  Kassette hinten: '+(filterList(p,'irisF2').join(', ')||'keine Filter eingetragen')); lines.push('  Beide Kassetten lassen sich kombinieren (Mischlösung).'); }
    else lines.push('  Verfügbare Filter: '+(filterList(p,'irisF').join(', ')||'keine Filter eingetragen'));
  }
  lines.push('Duplex-Einheit verstellbar: '+(p.hasDuplex?(fmt(p.dup[0])+'–'+fmt(p.dup[1])+' mm, Schritt 0,1 mm'):'nein'));
  lines.push('Duplex-Farbfilter: '+(p.hasDuplexFilter?('ja, verfügbar: '+(filterList(p,'dupF').join(', ')||'keine Filter eingetragen')):'nein'));
  lines.push('Polarisation vorhanden: '+(p.hasPol?'ja':'nein'));
  lines.push('Sonnenblende an der Optik: optional, nicht auf jeder Schiessanlage vorhanden oder erlaubt – wird pro Lage einzeln festgelegt.');
  lines.push('Ringkorn-Farbfilter: '+(p.hasRingFilter?('ja, verfügbar: '+(filterList(p,'ringC').join(', ')||'keine Filter eingetragen')):'nein'));
  lines.push('Ringkorn-UV-Filter vorhanden: '+(p.hasRingUV?'ja':'nein'));
  lines.push('Ringkorn-Grösse: '+fmt(p.ring[0])+'–'+fmt(p.ring[1])+' mm, Schritt '+fmt(p.steps.ring)+' mm');
  return lines.join('\n');
}
function runBaseAI(pin){
  var p=active();
  if(!SAMPLE||ui.baseAiBusy) return;
  ui.baseAiBusy=true; ui.baseAiMsg='Einen Moment, die KI prüft deine Visierung …'; render();
  var cap=capabilityText(p);
  var ref=SCENARIOS.map(function(s){
    return s.id+' ("'+s.full+'", '+s.desc+') – Normalwert zur Orientierung: Iris '+fmt(s.iris)+' mm mit '+s.irisF.join('/')+', Duplex '+fmt(s.dup)+' mm mit '+s.dupF.join('/')+', Ringkorn '+(s.ringC?s.ringC+' ':'ohne Farbfilter, ')+fmt(s.ringS)+' mm.';
  }).join('\n');
  var prompt='Du bestimmst Grundeinstellungen für ein Diopter-Visier (Sportschiessen), abgestimmt auf ein einzelnes, konkretes Sportgewehr.\n\n'
    +'Tatsächliche Ausstattung dieses Sportgewehrs:\n'+cap+'\n\n'
    +'Neun Lichtlagen mit einem allgemeinen Normalwert zur Orientierung (dieser passt evtl. nicht zur obigen Ausstattung, z. B. weil ein Bauteil fehlt oder ein Filtername nicht verfügbar ist):\n'+ref+'\n\n'
    +'Bestimme für jede Lage echte, eigenständig durchdachte Grundwerte für genau dieses Sportgewehr: wähle für jede physikalisch vorhandene Grösse und jeden vorhandenen Filter einen sinnvollen Wert, ausschliesslich aus den oben genannten, tatsächlich verfügbaren Möglichkeiten. Lass ein Feld weg, wenn das Bauteil laut Ausstattung nicht vorhanden ist. Bei fehlendem Filter wähle die sinnvollste verfügbare Alternative.\n\n'
    +'Optische Faustregeln für die Ringkorn-Farbe, als Orientierung – im Zweifel schwerer als der blosse Normalwert zu gewichten: Gelb/Orange steigert den Kontrast bei diesigem, nebligem oder trübem Licht (bindet blauen Dunst). Rot dunkelt bei sehr hellem, blendendem Licht angenehm ab, ohne stark zu verfälschen. Blau gleicht warmes/gelbliches Licht aus – bei Kunstlicht in der Halle oder bei tief stehender, direkt blendender Sonne. Bei sehr wenig Licht (Dämmerung, stark bewölkt-dunkel) schluckt ein Farbfilter zusätzlich wertvolles Licht: dort ist "kein Filter" oft sinnvoller als eine Farbe – wähle in solchen Lagen bewusst keinen Filter, wenn das Gerät das zulässt, statt reflexartig einen Normalwert zu übernehmen.\n\n'
    +'Polarisation gehört nicht zum Grundwert: Sie ist immer aus und wird vom Schützen bei Bedarf selbst am Stand zugeschaltet. Liefere dafür kein Feld.\n\n'
    +'Begründe jede Lage in einem kurzen, konkreten Satz auf Deutsch, der auf die Ausstattung und die Lichtsituation Bezug nimmt statt nur den Normalwert zu wiederholen.\n\n'
    +'Antworte ausschliesslich mit einem JSON-Array, ein Objekt pro Lage, exakt diese '+SCENARIOS.length+' "lage"-Werte verwenden: '+SCENARIOS.map(function(s){return s.id;}).join(', ')+'. Objektform (Felder nur, wenn das Bauteil vorhanden ist, ohne "pol"): {"lage":"sonne_hinten","iris":1.05,"irisF":"<Filtername ohne Klammerzusatz>","irisF2":"<nur bei zwei Kassetten>","dup":2.9,"dupF":"<Filtername>","ringC":"<Filtername, oder \\"\\" für bewusst keinen Filter>","ringUV":false,"ringS":3.1,"begruendung":"<Satz>"}.';
  SAMPLE.json(prompt).then(function(res){
    var arr=Array.isArray(res)?res:(res&&Array.isArray(res.lagen)?res.lagen:null);
    if(!arr){ ui.baseAiMsg='Die Antwort liess sich nicht auswerten. Bitte erneut versuchen.'; return; }
    var n=0;
    arr.forEach(function(item){
      if(!item||typeof item.lage!=='string') return;
      var sObj=SCENARIOS.filter(function(x){return x.id===item.lage;})[0]; if(!sObj) return;
      var nb={};
      ROWS.forEach(function(row){
        if(row.k==='pol') return;
        if(!rowOn(p,row)) return;
        var raw=item[row.k]; if(raw===undefined||raw===null) return;
        if(row.type==='num' && typeof raw==='number'){ nb[row.k]=clamp(snap(raw,p.steps[row.rk]),p[row.rk][0],p[row.rk][1]); }
        else if(row.type==='sel' && typeof raw==='string'){ var name=raw.replace(/\s*\([^)]*\)\s*$/,'').trim(); if(name===''||rowAvail(p,row).some(function(e){return e.name===name;})) nb[row.k]=name; }
        else if(row.type==='bool' && typeof raw==='boolean'){ nb[row.k]=raw; }
      });
      if(pin&&pin.lageId===item.lage){
        if(pin.ringS!=null) nb.ringS=pin.ringS;
        if(pin.dup!=null) nb.dup=pin.dup;
      }
      if(!Object.keys(nb).length) return;
      p.baseBackup[item.lage]=p.base[item.lage]?JSON.parse(JSON.stringify(p.base[item.lage])):null;
      p.base[item.lage]=nb;
      if(typeof item.begruendung==='string'&&item.begruendung.trim()) p.baseNote[item.lage]=item.begruendung.trim().slice(0,220);
      delete p.overrides[item.lage];
      n++;
    });
    if(pin&&pin.lageId){
      p.base[pin.lageId]=p.base[pin.lageId]||{};
      if(pin.ringS!=null) p.base[pin.lageId].ringS=pin.ringS;
      if(pin.dup!=null) p.base[pin.lageId].dup=pin.dup;
    }
    ui.baseAiMsg=n?('Grundregeln für '+n+' von '+SCENARIOS.length+' Lagen aktualisiert.'):'Es konnten keine gültigen Grundregeln ermittelt werden.';
    save();
  }).catch(function(err){
    var c=err&&err.code;
    ui.baseAiMsg = c==='not_granted' ? 'Ohne deine Freigabe kann die KI keine Grundregeln ermitteln.'
      : c==='rate_limited' ? 'Zu viele Anfragen. Versuche es gleich noch einmal.'
      : 'Die KI ist gerade nicht erreichbar.';
  }).then(function(){ ui.baseAiBusy=false; render(); });
}

function pad2(n){ return (n<10?'0':'')+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowHHMM(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function dtLabel(s){ return s.datum+(s.zeit?' '+s.zeit:''); }
function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

var RICHT_DEG={N:0,NO:45,O:90,SO:135,S:180,SW:225,W:270,NW:315};
var SONNE_SAISONS=[['Frühling',0],['Sommer',23.44],['Herbst',0],['Winter',-23.44]];
var SONNE_ZEITEN=[['06:00',6],['08:00',8],['10:00',10],['12:00',12],['14:00',14],['16:00',16],['18:00',18],['20:00',20]];
function sunPos(declDeg,hour){
  var phi=47*Math.PI/180, decl=declDeg*Math.PI/180, H=(15*(hour-12))*Math.PI/180;
  var sinEl=Math.sin(phi)*Math.sin(decl)+Math.cos(phi)*Math.cos(decl)*Math.cos(H);
  var el=Math.asin(Math.max(-1,Math.min(1,sinEl)))*180/Math.PI;
  var cosAz=(Math.sin(decl)-Math.sin(el*Math.PI/180)*Math.sin(phi))/(Math.cos(el*Math.PI/180)*Math.cos(phi));
  cosAz=Math.max(-1,Math.min(1,cosAz));
  var az=Math.acos(cosAz)*180/Math.PI;
  if(H>0) az=360-az;
  return {el:el,az:az};
}
function sunLageLabel(richtung,el,az){
  if(el<=0) return {k:'–',t:'Sonne unter dem Horizont'};
  if(el>=55) return {k:'oben',t:'Sonne von oben ('+Math.round(el)+'°)'};
  var f=RICHT_DEG[richtung]; if(f===undefined) return {k:'–',t:'–'};
  var rel=((az-f)%360+360)%360;
  if(rel<=45||rel>=315) return {k:'vorne',t:'Sonne von vorne ('+Math.round(el)+'°)'};
  if(rel>=135&&rel<=225) return {k:'hinten',t:'Sonne von hinten ('+Math.round(el)+'°)'};
  return {k:'seitlich',t:'Sonne seitlich, '+(rel<180?'von rechts':'von links')+' ('+Math.round(el)+'°)'};
}
function sonnenstandCard(r){
  if(!r.richtung||r.richtung==='Indoor') return '';
  var rows=SONNE_ZEITEN.map(function(zt){
    var cells=SONNE_SAISONS.map(function(sa){
      var pos=sunPos(sa[1],zt[1]);
      var lb=sunLageLabel(r.richtung,pos.el,pos.az);
      return '<td title="'+esc(lb.t)+'">'+esc(lb.k)+'</td>';
    }).join('');
    return '<tr><td>'+zt[0]+'</td>'+cells+'</tr>';
  }).join('');
  return '<section class="card flush"><h2 style="padding:14px 14px 0">Sonnenstand bei Schussrichtung '+esc(r.richtung)+'</h2>'
   +'<p class="small" style="margin:8px 14px 0">Grobe Richtwerte für die Schweiz (Breitengrad ca. 47°), je Jahreszeit und Tageszeit, bezogen auf deine Schussrichtung. Für die tatsächliche Lage am Stand bitte selbst prüfen.</p>'
   +'<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Zeit</th><th>Frühling</th><th>Sommer</th><th>Herbst</th><th>Winter</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'</section>';

function sbSave(){
  var f=ui.sbForm; if(!f) return;
  var p=state.profiles.filter(function(x){return x.id===f.gewehrId;})[0];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.datum||'')){ ui.sbMsg='Bitte ein gültiges Datum wählen.'; render(); return; }
  if(!p){ ui.sbMsg='Bitte ein Sportgewehr wählen.'; render(); return; }
  var used=f.teile.filter(function(t){return t.stich.trim()||t.schuss.toString().trim()||t.resultat.trim()||t.resultat110.trim()||t.iz.trim();});
  if(!used.length){ ui.sbMsg='Bitte mindestens eine Schusszahl oder ein Resultat eingeben.'; render(); return; }
  var teileClean=[], totalSchuss=0, badSchuss=false;
  used.forEach(function(t){
    var sn=Number(String(t.schuss).replace(',','.')); if(String(t.schuss).trim()===''){ sn=0; } else if(!isFinite(sn)||sn<0){ badSchuss=true; sn=0; }
    totalSchuss+=sn;
    teileClean.push({stich:t.stich.trim().slice(0,40),schuss:Math.round(sn),resultat:t.resultat.trim().slice(0,40),resultat110:t.resultat110.trim().slice(0,40),iz:t.iz.trim().slice(0,20)});
  });
  if(badSchuss){ ui.sbMsg='Bitte bei der Schusszahl nur Zahlen eingeben.'; render(); return; }
  function joinField(key){
    return teileClean.map(function(t){ return t[key]?((t.stich?t.stich+': ':'')+t[key]):''; }).filter(Boolean).join(' / ');
  }
  var oneSimple = teileClean.length===1 && !teileClean[0].stich;
  var losId=p.munition.some(function(m){return m.id===f.losId;})?f.losId:'';
  var zeitVal=/^\d{2}:\d{2}$/.test(f.zeit||'')?f.zeit:'';
  var entry={id:ui.sbEdit||uid(),datum:f.datum,zeit:zeitVal,gewehrId:p.id,
    anlage:String(f.anlage||'').trim().slice(0,60),anlass:String(f.anlass||'').trim().slice(0,60),
    schusszahl:Math.round(totalSchuss),
    resultat:oneSimple?teileClean[0].resultat:joinField('resultat'),
    resultat110:oneSimple?teileClean[0].resultat110:joinField('resultat110'),
    iz:oneSimple?teileClean[0].iz:joinField('iz'),
    teile:teileClean,
    losId:losId,losLabel:losLabelOf(p,losId),bemerkung:String(f.bemerkung||'').trim().slice(0,300),
    visier:f.visOn?visValsToSnap(p,f.visLage,f.visVals):null};
  if(ui.sbEdit){ state.shots=state.shots.map(function(s){return s.id===ui.sbEdit?entry:s;}); }
  else state.shots.push(entry);
  var keep={gewehrId:p.id,anlage:entry.anlage,anlass:entry.anlass,losId:losId,visOn:f.visOn,visLage:f.visLage};
  ui.sbEdit='';
  ui.sbForm=sbDefaultForm(); ui.sbForm.gewehrId=keep.gewehrId; ui.sbForm.anlage=keep.anlage; ui.sbForm.anlass=keep.anlass; ui.sbForm.losId=keep.losId; ui.sbForm.visOn=keep.visOn; ui.sbForm.visLage=keep.visLage;
  ui.sbMsg='Eintrag gespeichert.';
  save(); render();
}

function visValsToSnap(p,lageId,vals){

    var val=vals[row.k]; if(val===undefined) return;

      if(isFinite(n)) raw[row.k]=clamp(snap(n,p.steps[row.rk]||0.05),p[row.rk][0],p[row.rk][1]);

      if(val===''||rowAvail(p,row).some(function(e){return e.name===val;})) raw[row.k]=val;

function visierSnapshot(gewehrId,lageId){

function patRank(e){
  if(e.nums.length){ return {hasNum:true, avg:e.nums.reduce(function(a,b){return a+b;},0)/e.nums.length, n:e.nums.length, count:e.count}; }
  return {hasNum:false, avg:null, n:0, count:e.count};
}
function patCompare(a,b){
  if(a.hasNum&&b.hasNum) return b.avg-a.avg;
  if(a.hasNum!==b.hasNum) return a.hasNum?-1:1;
  return b.count-a.count;
}

function visCombos(list){

    if(!bySig[sig]) bySig[sig]={visier:s.visier,nums:[],count:0};
    bySig[sig].count++;

  });

      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      var added=0, dup=0, bad=0, anlagenCreated=0, anlaesseCreated=0;
      rows.forEach(function(r){
        var dRaw=r['Datum'], datum='', zeit='';
        if(dRaw instanceof Date && !isNaN(dRaw)){
          datum=dRaw.getFullYear()+'-'+String(dRaw.getMonth()+1).padStart(2,'0')+'-'+String(dRaw.getDate()).padStart(2,'0');
          if(dRaw.getHours()||dRaw.getMinutes()) zeit=String(dRaw.getHours()).padStart(2,'0')+':'+String(dRaw.getMinutes()).padStart(2,'0');
        } else if(typeof dRaw==='number'){
          var jd=new Date(Math.round((dRaw-25569)*86400*1000));
          if(!isNaN(jd)) datum=jd.getUTCFullYear()+'-'+String(jd.getUTCMonth()+1).padStart(2,'0')+'-'+String(jd.getUTCDate()).padStart(2,'0');
        } else if(typeof dRaw==='string'){
          var m=dRaw.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if(m) datum=m[0];
          else { var m2=dRaw.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/); if(m2) datum=m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0'); }
        }
        if(!/^\d{4}-\d{2}-\d{2}$/.test(datum)){ bad++; return; }
        var waffe=String(r['Waffe']||'').trim(), gid='';
        if(waffe){
          var ep=state.profiles.filter(function(x){return x.name===waffe;})[0];
          if(!ep){ ep=defaultProfile(waffe.slice(0,60)); ep.needsSetup=false; state.profiles.push(ep); }
          gid=ep.id;
        } else gid=state.activeId;
        var schuss=Number(r['Schusszahl']); if(!isFinite(schuss)||schuss<0) schuss=0;
        var entry={id:uid(),datum:datum,zeit:zeit,gewehrId:gid,
          anlage:String(r['Schiessanlage']||'').trim().slice(0,60),
          anlass:String(r['Anlass']||'').trim().slice(0,60),
          schusszahl:Math.round(schuss),
          resultat:String(r['Resultat']||'').trim().slice(0,120),
          resultat110:String(r['Resultat 1/10']||'').trim().slice(0,120),
          iz:String(r['IZ']||'').trim().slice(0,60),
          losId:'',losLabel:'',bemerkung:String(r['Bemerkung']||'').trim().slice(0,300),visier:null};
        if(entry.anlage){
          var exR=state.ranges.filter(function(x){return x.name.toLowerCase()===entry.anlage.toLowerCase();})[0];
          if(!exR){ state.ranges.push({id:uid(),name:entry.anlage,richtung:'',bemerkung:'',kappe:{},stiche:[],gewehre:[],active:true}); anlagenCreated++; }
        }
        if(entry.anlass){
          var exA=state.anlaesse.filter(function(x){return x.name.toLowerCase()===entry.anlass.toLowerCase();})[0];
          if(!exA){ state.anlaesse.push({id:uid(),name:entry.anlass,stiche:[],rundenwettkampf:false,runden:[],gewehre:[],active:true}); anlaesseCreated++; }
        }
        var isDup=state.shots.some(function(s){return s.datum===entry.datum&&s.gewehrId===entry.gewehrId&&s.anlage===entry.anlage&&s.anlass===entry.anlass&&s.schusszahl===entry.schusszahl&&s.resultat===entry.resultat;});
        if(isDup){ dup++; return; }
        state.shots.push(entry); added++;
      });
      function restoreSheet(sheetName,cleanOne,targetArr){
        if(wb.SheetNames.indexOf(sheetName)<0) return 0;
        var wsX=wb.Sheets[sheetName], rowsX=XLSX.utils.sheet_to_json(wsX,{defval:''}), n=0;
        rowsX.forEach(function(rr){
          var raw=rr['Daten (JSON)']; if(!raw) return;
          var parsed; try{ parsed=JSON.parse(raw); }catch(e){ return; }
          var item=cleanOne(parsed); if(!item) return;
          var idx=targetArr.findIndex(function(x){return x.id===item.id;});
          if(idx<0) idx=targetArr.findIndex(function(x){return x.name===item.name;});
          if(idx>=0) targetArr[idx]=item; else targetArr.push(item);
          n++;
        });
        return n;
      }
      var profilesRestored=restoreSheet('Sportgewehre',function(x){return normalize(x);},state.profiles);
      var rangesRestored=restoreSheet('Schiessanlagen',function(x){var c=cleanRanges([x]); return c[0]||null;},state.ranges);
      var anlaesseRestored=restoreSheet('Anlässe',function(x){var c=cleanAnlaesse([x]); return c[0]||null;},state.anlaesse);

      if(added||profilesRestored||rangesRestored||anlaesseRestored||anlagenCreated||anlaesseCreated) save();
      var msg='Import abgeschlossen: '+added+' neue Einträge';
      if(dup) msg+=', '+dup+' bereits vorhanden übersprungen';
      if(bad) msg+=', '+bad+' ohne gültiges Datum übersprungen';
      if(profilesRestored) msg+=', '+profilesRestored+' Sportgewehre wiederhergestellt';
      if(rangesRestored) msg+=', '+rangesRestored+' Schiessanlagen wiederhergestellt';
      if(anlaesseRestored) msg+=', '+anlaesseRestored+' Anlässe wiederhergestellt';
      if(anlagenCreated) msg+=', '+anlagenCreated+' Schiessanlagen neu angelegt';
      if(anlaesseCreated) msg+=', '+anlaesseCreated+' Anlässe neu angelegt';
      ui.sbMsg=msg+'.';
    }catch(err){
      ui.sbMsg='Die Datei konnte nicht gelesen werden. Bitte eine .xlsx-Datei mit denselben Spalten wie beim Export verwenden.';
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}
function browserDownloadBlob(blob,filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename; a.style.display='none'; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} try{ URL.revokeObjectURL(url); }catch(e){} },2000);
    return true;
  }catch(e){ return false; }
}
function saveBlobEverywhere(blob,filename){
  if(window.claude&&typeof window.claude.use==='function'){
    return window.claude.use('downloads').then(function(DL){
      if(!DL) return browserDownloadBlob(blob,filename);
      return DL.save({filename:filename,data:blob}).then(function(){return true;});
    }).catch(function(){
      return browserDownloadBlob(blob,filename);
    });
  }
  return Promise.resolve(browserDownloadBlob(blob,filename));
}

    });

    XLSX.utils.book_append_sheet(wb,ws3,'Schiessanlagen');

    var evRows=state.anlaesse.map(function(a){
      return {'Name':a.name,'Rundenwettkampf':a.rundenwettkampf?'Ja':'Nein','Daten (JSON)':JSON.stringify(a)};
    });
    var ws4=XLSX.utils.json_to_sheet(evRows);

    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var filename='Backup_'+todayISO()+'.xlsx';
    saveBlobEverywhere(blob,filename).then(function(ok){
      if(ok){ ui.homeMsg='Backup heruntergeladen: '+state.shots.length+' Einträge, '+state.profiles.length+' Sportgewehre, '+state.ranges.length+' Schiessanlagen, '+state.anlaesse.length+' Anlässe.'; setLastBackup(); }
      else { ui.homeMsg='Herunterladen hat nicht geklappt. Bitte nochmals versuchen.'; }
      render();
    }).catch(function(){ ui.homeMsg='Herunterladen hat nicht geklappt. Bitte nochmals versuchen.'; render(); });
  }catch(err){
    ui.homeMsg='Beim Erstellen des Backups ist ein Fehler aufgetreten.'; render();
  }

function exportSchiessbuchXlsx(list){
  if(typeof XLSX==='undefined'){ ui.sbMsg='Export ist gerade nicht verfügbar (Bibliothek konnte nicht geladen werden).'; render(); return; }
  if(!list.length){ ui.sbMsg='Keine Einträge für diese Auswahl zum Exportieren.'; render(); return; }
  ui.sbMsg='Export wird vorbereitet …'; render();
  try{
    var rows=list.map(function(s){
      var p=state.profiles.filter(function(x){return x.id===s.gewehrId;})[0];
      return {'Datum':new Date(s.datum+'T'+(s.zeit||'00:00')+':00'),'Schiessanlage':s.anlage||'','Anlass':s.anlass||'','Waffe':p?p.name:'',
        'Schusszahl':s.schusszahl,'Resultat':s.resultat||'','Resultat 1/10':s.resultat110||'','IZ':s.iz||'','Bemerkung':s.bemerkung||''};
    });
    var ws=XLSX.utils.json_to_sheet(rows,{cellDates:true});
    ws['!cols']=[{wch:11},{wch:18},{wch:18},{wch:10},{wch:10},{wch:16},{wch:14},{wch:10},{wch:30}];
    var range=XLSX.utils.decode_range(ws['!ref']||'A1');
    for(var R=range.s.r+1;R<=range.e.r;R++){ var cell=ws[XLSX.utils.encode_cell({r:R,c:0})]; if(cell) cell.z='yyyy-mm-dd'; }
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Schiessdaten');
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var filename='Schiessbuch_'+todayISO()+'.xlsx';
    saveBlobEverywhere(blob,filename).then(function(ok){
      if(ok){ ui.sbMsg='Export heruntergeladen: '+list.length+' Einträge.'; setLastBackup(); }
      else { ui.sbMsg='Herunterladen hat nicht geklappt. Bitte nochmals versuchen.'; }
      render();
    }).catch(function(){ ui.sbMsg='Herunterladen hat nicht geklappt. Bitte nochmals versuchen.'; render(); });
  }catch(err){
    ui.sbMsg='Beim Erstellen des Exports ist ein Fehler aufgetreten.'; render();
  }
}

function viewSbAuswertung(){
  var years={}; state.shots.forEach(function(s){ years[s.datum.slice(0,4)]=true; });
  var yearList=Object.keys(years).sort().reverse();
  var curY=String(new Date().getFullYear());
  var opts='<option value="aktuell"'+(ui.sbYear==='aktuell'?' selected':'')+'>Aktuelles Jahr ('+curY+')</option>'
    +yearList.filter(function(y){return y!==curY;}).map(function(y){return '<option value="'+y+'"'+(ui.sbYear===y?' selected':'')+'>'+y+'</option>';}).join('')
    +'<option value="gesamt"'+(ui.sbYear==='gesamt'?' selected':'')+'>Gesamt (alle Jahre)</option>';
  var filt=state.shots.filter(function(s){
    if(ui.sbYear==='gesamt') return true;
    if(ui.sbYear==='aktuell') return s.datum.slice(0,4)===curY;
    return s.datum.slice(0,4)===ui.sbYear;
  });
  var byGun={}, order=[];
  filt.forEach(function(s){
    if(!byGun[s.gewehrId]){ byGun[s.gewehrId]={count:0,sum:0}; order.push(s.gewehrId); }
    byGun[s.gewehrId].count++; byGun[s.gewehrId].sum+=(s.schusszahl||0);
  });
  var totalSum=0,totalCount=0;
  var rows=order.map(function(id){
    var p=state.profiles.filter(function(x){return x.id===id;})[0];
    var g=byGun[id]; totalSum+=g.sum; totalCount+=g.count;
    return '<tr><td>'+esc(p?p.name:'gelöschtes Sportgewehr')+'</td><td>'+g.count+'</td><td>'+g.sum+'</td></tr>';
  }).join('');
  return '<section class="card"><h2>Zeitraum</h2><label class="sr" for="sbyear">Zeitraum</label>'
   +'<select class="f" id="sbyear" data-a="sbyear" aria-label="Zeitraum" style="max-width:260px">'+opts+'</select></section>'
   +'<section class="card flush"><h2 style="padding:14px 14px 0">Schusszahlen pro Sportgewehr</h2>'
   +(rows?('<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Sportgewehr</th><th>Einträge</th><th>Schüsse</th></tr></thead><tbody>'+rows

   :'<p class="small" style="padding:0 14px 14px">Für diesen Zeitraum sind keine Einträge vorhanden.</p>')+'</section>';
}
